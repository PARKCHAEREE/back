# ===================================================================
# = COMMON APPLICATION PROPERTIES
# ===================================================================

# --- Spring JPA & Hibernate Settings ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# --- Default AI Server URL ---
ai.server.base-url=https://scorecard-playoff-bankroll.ngrok-free.dev

# ========== Email Configuration ==========
# Naver SMTP Email Settings
spring.mail.host=smtp.naver.com
spring.mail.port=465
spring.mail.username=sass090023@naver.com
spring.mail.password= # 실제 앱 비밀번호를 여기에 입력하거나, 환경 변수를 사용하세요.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.naver.com

# ===================================================================
# = API Documentation (SpringDoc OpenAPI / Swagger UI)
# ===================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.default-ui-started=true
springdoc.packages-to-scan=com.solarwise.capstonebackend.controller
