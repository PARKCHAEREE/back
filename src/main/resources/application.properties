spring.application.name=CapstoneBackend

# ========== Database Configuration ==========
spring.datasource.url=jdbc:mysql://localhost:3306/solarwise
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA/Hibernate Configuration ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ========== JWT Configuration ==========
jwt.secret-key=your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-use-a-long-key
jwt.expiration-time=86400000

# ========== Logging Configuration ==========
logging.level.root=INFO
logging.level.com.solarwise.capstonebackend=DEBUG

# ========== Server Configuration ==========
server.port=8080
server.servlet.context-path=/
