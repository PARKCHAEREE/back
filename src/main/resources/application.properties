spring.application.name=CapstoneBackend

# 기본 실행은 로컬(H2)용인 swagger 프로필 단독 사용
spring.profiles.active=swagger

# ========== JPA/Hibernate Common Configuration ==========
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ========== Swagger UI Configuration ==========
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ========== JWT Configuration ==========
jwt.secret-key=your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-use-a-long-key
jwt.expiration-time=86400000

# ========== Logging Configuration ==========
logging.level.root=INFO
logging.level.com.solarwise.capstonebackend=DEBUG

# ========== Server Configuration ==========
server.port=8080
server.servlet.context-path=/

# ========== AI Server Configuration ==========
ai.server.base-url=http://localhost:8000/api/v1

# ========== Email Configuration ==========
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
