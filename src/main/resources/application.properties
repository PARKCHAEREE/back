spring.application.name=CapstoneBackend

# 기본 실행은 로컬(H2)용인 swagger 프로필 단독 사용
spring.profiles.active=swagger

# ========== JPA/Hibernate Common Configuration ==========
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ========== Swagger UI Configuration ==========
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ========== JWT Configuration ==========
jwt.secret-key=your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-use-a-long-key
jwt.expiration-time=86400000

# ========== Logging Configuration ==========
logging.level.root=INFO
logging.level.com.solarwise.capstonebackend=DEBUG

# ========== Server Configuration ==========
server.port=8080
server.servlet.context-path=/

# ========== AI Server Configuration ==========
ai.server.base-url=https://caterer-stupor-greedily.ngrok-free.dev

# ========== Email Configuration ==========
# 네이버 SMTP 이메일 설정
spring.mail.host=smtp.naver.com
spring.mail.port=465
spring.mail.username=sass090023@naver.com
spring.mail.password=앱비번
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.naver.com
# ========== 파일 업로드 용량 제한 해제 ==========
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
