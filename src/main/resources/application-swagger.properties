# ========== H2 Database Configuration (로컬 단독 테스트용) ==========
spring.datasource.url=jdbc:h2:mem:solarwise;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# ========== JPA / Hibernate ==========
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 매번 실행 시 테이블을 새로 생성 (로컬 테스트용)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ========== Custom API Keys ==========
# Swagger 로컬 확인용 더미 키 (실제 기상 API 호출 시 유효 키 교체 필요)
kma.api.key=dummy-local-key