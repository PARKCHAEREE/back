# Swagger 확인용 로컬 프로필 (MySQL 없이 실행)
spring.datasource.url=jdbc:h2:mem:solarwise;MODE=MySQL;NON_KEYWORDS=USER,USERS;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Swagger 로컬 확인용 더미 키 (실제 기상 API 호출 시에는 유효 키로 교체 필요)
kma.api.key=dummy-local-key

