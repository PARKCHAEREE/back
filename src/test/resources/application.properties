spring.application.name=CapstoneBackendTest

spring.datasource.url=jdbc:h2:mem:solarwise-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret-key=your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-use-a-long-key
jwt.expiration-time=86400000

# ========== 외부 API 테스트용 더미값 ==========
kma.api.key=test-kma-api-key
ai.server.base-url=https://subatomic-graves-stylist.ngrok-free.dev

